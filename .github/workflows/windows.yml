# Windows: Higiri.exe in a ZIP (no installer; unzip and run).
# Start it from the Actions tab ("Run workflow"). Releases come from release.yml.
# The ZIP is attached to the run as is (Higiri_<version>_windows_x64.zip).
name: Windows build

# Manual only; a tag push runs release.yml instead.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # No debug info in the test build: smaller cache, faster linking (most of all
  # on Windows). Local development keeps it.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Compiled dependencies, kept between runs (also after a failed run).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install packages
        run: npm ci

      # Types are checked by the build (build:web); clippy runs in `npm run check`
      # before committing, so CI skips it to save time.
      - name: Test the screens (Vitest)
        run: npm test

      - name: Test the Rust side (cargo test)
        run: npm run test:rust

      - name: Build and pack the ZIP
        run: npm run build

      # archive: false uploads the ZIP itself, so the download is not zipped twice.
      - uses: actions/upload-artifact@v7
        with:
          path: release/*.zip
          archive: false
          if-no-files-found: error
