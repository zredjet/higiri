# macOS disk image (.dmg) for Apple Silicon Macs.
# Start it from the Actions tab ("Run workflow"), or push a tag such as v1.0.0.
# The disk image is attached to the run as the artifact "higiri-macos".
# The app is ad-hoc signed only (no Apple Developer ID), so macOS asks for
# confirmation the first time it is opened.
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install packages
        run: npm ci

      - name: Check (types, Vitest, cargo test, clippy)
        run: npm run check

      - name: Build the disk image
        run: npm run tauri -- build --bundles dmg

      - uses: actions/upload-artifact@v7
        with:
          name: higiri-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
