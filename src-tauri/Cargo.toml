[package]
name = "higiri"
version = "0.5.0"
description = "Higiri: project-based TODO manager"
authors = []
edition = "2024"
# Two executables (v0.5.0): `cargo run` and `tauri dev` start the app.
default-run = "higiri"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
# See https://github.com/rust-lang/cargo/issues/8519
name = "higiri_lib"
# Desktop only: the staticlib / cdylib outputs are for iOS / Android, and
# linking them made every build (tests included) slower, most of all on Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
# tray-icon: the tray (v1.1, phase 10); image-png: the tray and toast icons.
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
serde = { version = "1.0.229", features = ["derive"] }
# raw_value: the JSON export keeps stored JSON (todo_events.note, settings) as written.
serde_json = { version = "1.0.154", features = ["raw_value"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2.0.21"
tauri-plugin-opener = "2.7.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-log = "2.10.2"
tauri-plugin-window-state = "2.5.0"
log = "0.4.35"
# OS notifications (v1.1). Used from Rust only; the screens get no permission.
tauri-plugin-notification = "2.8.1"
# The resident timer (tokio::time::sleep, tokio::sync::Notify, select!); Tauri's own runtime is tokio.
# rt: higiri-cli runs on a runtime of its own (v0.5.0).
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt"] }
# Tauri 2 has no stable tauri-specta yet: keep these three pinned as one compatible set.
specta = { version = "=2.0.0-rc.28", features = ["derive", "chrono"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
# higiri-cli (v0.5.0): its arguments and help, and the app data folder found
# as Tauri finds it (the same dirs as Tauri's).
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tempfile = "3.27.0"

# No LTO and the default codegen units: the binary is about 10% larger
# (14.4 -> 15.8 MB), but a release build takes half the time from scratch
# (101 s -> 46 s on an M-series Mac), and seconds instead of about a minute when
# only the app changed (CI keeps the dependencies cached).
[profile.release]
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
# Start at login (v1.1). Used from Rust only; the screens get no permission.
tauri-plugin-autostart = "2.7.0"

# Registers the toast AUMID under HKCU (v1.1). Already in the tree through tauri-build.
[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
