<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>起動時リマインド</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aizome/tokens.css">
<link rel="stylesheet" href="ds/aizome/components/bundle.css">
<script src="ds/aizome/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+JP:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 22px;">
  <dc-import name="Main" hint-size="100%,960px"></dc-import>
  <x-import component-from-global-scope="Aizome.Dialog" open="{{yes}}" size="lg" title="日限の近いTODOが5件あります" description="2026/11/19(木)の確認です。超過と本日のものから対応してください。待ちのものは相手に確認してください。" footer="{{footer}}">
    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border);">
        <div style="flex: 0 0 88px; display: flex;">
          <x-import component-from-global-scope="Aizome.Badge" tone="danger" dot="{{yes}}">超過</x-import>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <span style="font-weight: 500;">ライセンス棚卸し</span>
          <span style="font-size: 12px; line-height: 18px; letter-spacing: 0.02em; color: var(--text-muted);">社内ツール整備</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
          <span style="font-variant-numeric: tabular-nums;">日限 11/17</span>
          <span style="font-size: 12px; line-height: 18px; font-weight: 500; color: var(--danger);">2日超過</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border);">
        <div style="flex: 0 0 88px; display: flex;">
          <x-import component-from-global-scope="Aizome.Badge" tone="warning" dot="{{yes}}">本日</x-import>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <span style="font-weight: 500;">移行手順書のドラフト</span>
          <span style="font-size: 12px; line-height: 18px; letter-spacing: 0.02em; color: var(--text-muted);">基幹システム更改</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
          <span style="font-variant-numeric: tabular-nums;">日限 11/19</span>
          <span style="font-size: 12px; line-height: 18px; font-weight: 500; color: var(--warning);">今日が日限</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border);">
        <div style="flex: 0 0 88px; display: flex;">
          <x-import component-from-global-scope="Aizome.Badge" tone="primary" dot="{{yes}}">間近</x-import>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <span style="font-weight: 500;">API設計書のレビュー対応</span>
          <span style="font-size: 12px; line-height: 18px; letter-spacing: 0.02em; color: var(--text-muted);">基幹システム更改</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
          <span style="font-variant-numeric: tabular-nums;">日限 11/20</span>
          <span style="font-size: 12px; line-height: 18px; color: var(--text-muted);">あと1日 ・ 待ち</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border);">
        <div style="flex: 0 0 88px; display: flex;">
          <x-import component-from-global-scope="Aizome.Badge" tone="warning" dot="{{yes}}">要確認</x-import>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <span style="font-weight: 500;">募集要項ページの原稿確認</span>
          <span style="font-size: 12px; line-height: 18px; letter-spacing: 0.02em; color: var(--text-muted);">採用サイト改修 ・ 人事部の原稿確認待ち</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
          <span style="font-variant-numeric: tabular-nums;">確認日 11/19</span>
          <span style="font-size: 12px; line-height: 18px; font-weight: 500; color: var(--warning);">待ち3日目</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);">
        <div style="flex: 0 0 88px; display: flex;">
          <x-import component-from-global-scope="Aizome.Badge" tone="neutral" dot="{{yes}}">着手遅れ</x-import>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <span style="font-weight: 500;">性能試験の環境準備</span>
          <span style="font-size: 12px; line-height: 18px; letter-spacing: 0.02em; color: var(--text-muted);">基幹システム更改</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
          <span style="font-variant-numeric: tabular-nums;">予定開始 11/17</span>
          <span style="font-size: 12px; line-height: 18px; color: var(--text-muted);">2日経過</span>
        </div>
      </div>
    </div>
    <span style="font-size: 12px; line-height: 18px; letter-spacing: 0.02em; color: var(--text-muted);">日限注意があるあいだ、起動のたびに表示します。頻度は設定で変えられます。</span>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const R = window.React;
    const A = window.Aizome || {};
    const h = R ? R.createElement : null;
    const footer = (h && A.Button)
      ? h(A.Button, { variant: 'primary' }, '確認しました')
      : null;
    return { yes: true, footer: footer };
  }
}
</script>
</body>
</html>
